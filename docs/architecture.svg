<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Kahu Ola SmokeWatch — AWS architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#555;stroke-width:1.4;rx:8}
      .ext{fill:#f2f4f7;stroke:#8a94a6;stroke-width:1.2;stroke-dasharray:5 4}
      .aws{fill:#fff7ec;stroke:#d9822b;stroke-width:1.6}
      .safe{fill:#eef7ee;stroke:#3b8a3b;stroke-width:1.6}
      .h{font-weight:bold;font-size:14px;fill:#1c2430}
      .s{fill:#4a5363;font-size:12px}
      .l{fill:#333;font-size:12px}
      .e{stroke:#444;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .d{stroke:#3b8a3b;stroke-width:1.8;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1040" height="640" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1c2430">Kahu Ola SmokeWatch — architecture</text>
  <text x="24" y="54" class="s">AWS SAM stack · us-east-1 · one container image, two Lambda functions</text>

  <!-- AWS account boundary -->
  <rect x="250" y="76" width="560" height="520" rx="12" fill="none" stroke="#d9822b" stroke-width="1.2" stroke-dasharray="8 5"/>
  <text x="264" y="96" class="s" fill="#b36a1e">AWS account (SAM stack kahuola-smokewatch)</text>

  <!-- External sources -->
  <rect x="24" y="120" width="200" height="78" class="ext" rx="8"/>
  <text x="36" y="144" class="h">NOAA GOES-18 ABI</text>
  <text x="36" y="162" class="s">s3://noaa-goes18 (public)</text>
  <text x="36" y="178" class="s">L2 MCMIP CONUS, every 5 min</text>

  <rect x="24" y="236" width="200" height="78" class="ext" rx="8"/>
  <text x="36" y="260" class="h">NASA FIRMS</text>
  <text x="36" y="278" class="s">VIIRS S-NPP / NOAA-20, MODIS</text>
  <text x="36" y="294" class="s">area API (MAP_KEY)</text>

  <rect x="24" y="352" width="200" height="94" class="ext" rx="8"/>
  <text x="36" y="376" class="h">Claude Sonnet 5.5</text>
  <text x="36" y="394" class="s">Anthropic Messages API</text>
  <text x="36" y="410" class="s">or Amazon Bedrock Converse</text>
  <text x="36" y="430" class="s">(AgentPolicy parameter)</text>

  <!-- Scheduler -->
  <rect x="290" y="112" width="200" height="50" class="aws" rx="8"/>
  <text x="302" y="134" class="h">EventBridge schedule</text>
  <text x="302" y="151" class="s">rate(10 minutes)</text>

  <!-- Scan function -->
  <rect x="290" y="200" width="250" height="230" class="aws" rx="8"/>
  <text x="302" y="224" class="h">ScanFunction (Lambda, 1536 MB)</text>
  <text x="302" y="246" class="l">1. fetch scans t, t−5, t−10 + 9 refs</text>
  <text x="302" y="264" class="l">2. reproject → 0.02° grid (cv2.remap)</text>
  <text x="302" y="282" class="l">3. median 3-day thermal background</text>
  <text x="302" y="300" class="l">4. ΔT anomaly, land/volcanic masks,</text>
  <text x="316" y="316" class="l">connected components → candidates</text>
  <text x="302" y="334" class="l">5. agent loop (tools + code rails)</text>
  <text x="316" y="350" class="l">track_plume (DIS optical flow),</text>
  <text x="316" y="366" class="l">query_firms → review / recheck / dismiss</text>
  <text x="302" y="390" class="s">LLM error → RulePolicy fallback</text>
  <text x="302" y="408" class="s">agent can never publish</text>

  <!-- SSM -->
  <rect x="290" y="470" width="250" height="60" class="aws" rx="8"/>
  <text x="302" y="494" class="h">SSM Parameter Store</text>
  <text x="302" y="512" class="s">SecureString API key, read at cold start</text>

  <!-- S3 bucket -->
  <rect x="580" y="200" width="210" height="230" class="aws" rx="8"/>
  <text x="592" y="224" class="h">S3 bucket (private, SSE)</text>
  <text x="592" y="248" class="l">bg/frames/   cached grids (5 d)</text>
  <text x="592" y="268" class="l">latest/   overlay.png, summary</text>
  <text x="592" y="288" class="l">traces/   agent traces (30 d)</text>
  <text x="592" y="308" class="l">rechecks/   pending (2 d)</text>
  <text x="592" y="328" class="l">reviews/pending/</text>
  <text x="592" y="348" class="l">reviews/published/ · rejected/</text>
  <text x="592" y="372" class="l" font-weight="bold">public/smoke.geojson</text>
  <text x="592" y="390" class="s">+ disclaimer on every feature</text>

  <!-- Http function -->
  <rect x="580" y="470" width="210" height="96" class="aws" rx="8"/>
  <text x="592" y="494" class="h">HttpFunction (Function URL)</text>
  <text x="592" y="514" class="l">GET /  review page</text>
  <text x="592" y="532" class="l">GET /api/latest, /api/trace/{id}</text>
  <text x="592" y="550" class="l">POST /review (token, HMAC compare)</text>

  <!-- Humans / consumers -->
  <rect x="846" y="440" width="170" height="86" class="safe" rx="8"/>
  <text x="858" y="464" class="h">Human reviewer</text>
  <text x="858" y="482" class="s">sees overlay + evidence</text>
  <text x="858" y="498" class="s">approve → publish</text>
  <text x="858" y="514" class="s">reject → archive</text>

  <rect x="846" y="230" width="170" height="80" class="ext" rx="8"/>
  <text x="858" y="254" class="h">Public map / apps</text>
  <text x="858" y="272" class="s">GET /public/smoke.geojson</text>
  <text x="858" y="288" class="s">(CORS *, read-only)</text>

  <!-- Edges -->
  <path class="e" d="M390,162 L390,198"/>
  <path class="e" d="M224,166 C260,166 260,240 288,240"/>
  <text x="150" y="214" class="s">anonymous S3 GET</text>
  <path class="e" d="M224,275 L288,300"/>
  <path class="e" d="M224,398 L288,380"/>
  <path class="e" d="M415,468 L415,432"/>
  <path class="e" d="M540,260 L578,260"/>
  <path class="e" d="M578,280 L542,280"/>
  <text x="543" y="252" class="s">write</text>
  <text x="544" y="298" class="s">cache</text>
  <path class="e" d="M685,468 L685,432"/>
  <path class="e" d="M844,500 L792,510"/>
  <path class="d" d="M792,540 C830,560 830,340 792,372"/>
  <text x="816" y="420" class="s" fill="#3b8a3b">approve</text>
  <path class="e" d="M792,368 C820,360 820,280 844,272"/>

  <text x="24" y="618" class="s">Only the reviewer's POST /review writes public/smoke.geojson. Secrets: FIRMS_MAP_KEY and REVIEW_TOKEN are NoEcho stack parameters; the Anthropic key stays in SSM.</text>
</svg>
